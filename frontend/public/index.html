<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="AlizceTV" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet" />
    <title>AlizceTV</title>
    <script>
      window.addEventListener("error", function (e) {
        e.error instanceof DOMException &&
          "DataCloneError" === e.error.name &&
          e.message &&
          e.message.includes("PerformanceServerTiming") &&
          (e.stopImmediatePropagation(), e.preventDefault());
      }, true);
    </script>
    <style>
      /* AlizceTV N100: parche de rendimiento para GPU Intel UHD.
         Desactiva animaciones infinitas que mantenian la GPU al 100%. */
      .animate-ping,
      [class*="animate-ping"] {
        animation: none !important;
      }
      *, *::before, *::after {
        animation-name: none !important;
      }
    </style>
    <style>
      /* AlizceTV N100: quitar efectos caros de GPU (backdrop-filter, sombras, filtros)
         para que la UI no haga picos del 100% al navegar. */
      * {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      *[class*="glass"],
      .glass,
      .glass-strong {
        background-color: rgba(15, 23, 42, 0.92) !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      * {
        box-shadow: none !important;
      }
      *[class*="drop-shadow"],
      .drop-shadow-\[0_0_16px_rgba\(56\,189\,248\,0\.55\)\] {
        filter: none !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      /* AlizceTV: Ctrl+W actua como Escape (volver atras) */
      window.addEventListener("keydown", function (e) {
        if (e.ctrlKey && (e.key === "w" || e.key === "W")) {
          e.preventDefault();
          e.stopImmediatePropagation();
          var ev = new KeyboardEvent("keydown", {
            key: "Escape",
            code: "Escape",
            keyCode: 27,
            which: 27,
            bubbles: true,
            cancelable: true,
          });
          document.dispatchEvent(ev);
        }
      }, true);
    </script>
  </body>
</html>
