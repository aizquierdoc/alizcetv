<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1328"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="aFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.6" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#4f46e5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="aura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

  <!-- Aurora glow in the middle -->
  <ellipse cx="128" cy="110" rx="150" ry="110" fill="url(#glow)"/>

  <!-- Scanlines (subtle TV motif) -->
  <g opacity="0.08" fill="#ffffff">
    <rect x="24" y="52"  width="208" height="1"/>
    <rect x="24" y="80"  width="208" height="1"/>
    <rect x="24" y="108" width="208" height="1"/>
    <rect x="24" y="136" width="208" height="1"/>
    <rect x="24" y="164" width="208" height="1"/>
    <rect x="24" y="192" width="208" height="1"/>
  </g>

  <!-- Thin border -->
  <rect x="4" y="4" width="248" height="248" rx="52" ry="52" fill="none"
        stroke="url(#stroke)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Soft outer blur duplicate of the A letter for glow -->
  <g filter="url(#aura)" opacity="0.75">
    <path d="M 70 196 L 128 56 L 186 196 L 160 196 L 148 164 L 108 164 L 96 196 Z
             M 116 142 L 140 142 L 128 110 Z"
          fill="#22d3ee"/>
  </g>

  <!-- Main A monogram -->
  <path d="M 70 196 L 128 56 L 186 196 L 160 196 L 148 164 L 108 164 L 96 196 Z
           M 116 142 L 140 142 L 128 110 Z"
        fill="url(#aFill)"/>

  <!-- Center scan line crossing the A -->
  <rect x="34" y="140" width="188" height="2" fill="#22d3ee" opacity="0.55"/>
  <rect x="34" y="140" width="188" height="2" fill="#22d3ee" opacity="0.3" filter="url(#soft)"/>

  <!-- Small TV eyebrow label -->
  <g>
    <rect x="104" y="212" width="48" height="18" rx="4" ry="4"
          fill="none" stroke="#22d3ee" stroke-opacity="0.65" stroke-width="1.2"/>
    <text x="128" y="226" text-anchor="middle"
          font-family="'Courier New', monospace" font-size="11"
          fill="#67e8f9" letter-spacing="4">TV</text>
  </g>

  <!-- Corner dots -->
  <circle cx="22" cy="22" r="2" fill="#67e8f9"/>
  <circle cx="234" cy="22" r="2" fill="#c084fc"/>
  <circle cx="22" cy="234" r="2" fill="#c084fc"/>
  <circle cx="234" cy="234" r="2" fill="#67e8f9"/>
</svg>
