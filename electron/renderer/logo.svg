<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1328"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="aFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.6" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="aura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

  <!-- Soft glow -->
  <ellipse cx="128" cy="118" rx="140" ry="100" fill="url(#glow)"/>

  <!-- Thin accent border -->
  <rect x="6" y="6" width="244" height="244" rx="50" ry="50" fill="none"
        stroke="url(#stroke)" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Glow duplicate of the A -->
  <g filter="url(#aura)" opacity="0.9">
    <path d="M 68 198 L 128 44 L 188 198 L 160 198 L 148 164 L 108 164 L 96 198 Z
             M 116 138 L 140 138 L 128 100 Z"
          fill="#22d3ee"/>
  </g>

  <!-- Main A monogram -->
  <path d="M 68 198 L 128 44 L 188 198 L 160 198 L 148 164 L 108 164 L 96 198 Z
           M 116 138 L 140 138 L 128 100 Z"
        fill="url(#aFill)"/>

  <!-- Horizontal signal line across the A -->
  <rect x="60" y="150" width="136" height="3" rx="1.5" fill="#22d3ee" opacity="0.75"/>

  <!-- Minimal "TV" eyebrow label -->
  <g transform="translate(128, 220)">
    <rect x="-22" y="0" width="44" height="20" rx="4" ry="4"
          fill="none" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="0" y="14" text-anchor="middle"
          font-family="'Courier New', monospace" font-size="12" font-weight="700"
          fill="#67e8f9" letter-spacing="4">TV</text>
  </g>
</svg>
